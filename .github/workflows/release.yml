name: Auto Release (All Linux Arch)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARY_NAME: dnshammer

jobs:
  release:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            build_cmd: v -prod -cflags "-static" -os linux -arch amd64 -o ${{ env.BINARY_NAME }}-linux-amd64 .

          - arch: arm64
            runner: ubuntu-22.04-arm
            build_cmd: |
              sudo apt-get update && sudo apt-get install -y musl-tools
              CC=musl-gcc v -prod -cflags "-static" -os linux -arch arm64 -o ${{ env.BINARY_NAME }}-linux-arm64 .

          - arch: armv7
            runner: ubuntu-latest
            build_cmd: |
              sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
              CC=arm-linux-gnueabihf-gcc v -prod -cflags "-static" -os linux -arch arm -o ${{ env.BINARY_NAME }}-linux-armv7 .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install V
        uses: vlang/setup-v@v1
        with:
          check-latest: true

      - name: Build binary
        run: ${{ matrix.build_cmd }}

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          artifacts: ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}
          generateReleaseNotes: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

name: Auto Release (All Linux Arch)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            build_cmd: v -enable-globals -prod -cflags "-static" -os linux -arch amd64 -o dnshammer-linux-amd64 .

          - arch: arm64
            runner: ubuntu-22.04-arm
            build_cmd: |
              docker run --rm -v $PWD:/app -w /app alpine:3.19 sh -c "
                apk add --no-cache musl-dev gcc git make
                wget https://github.com/vlang/v/releases/latest/download/v_linux_arm64.zip -O /tmp/v.zip
                unzip /tmp/v.zip -d /tmp
                export PATH=/tmp/v:\$PATH
                v -enable-globals -prod -cflags '-static' -os linux -arch arm64 -o dnshammer-linux-arm64 .
              "

          - arch: armv7
            runner: ubuntu-latest
            build_cmd: |
              sudo apt-get update
              sudo apt-get install -y gcc-arm-linux-gnueabihf
              CC=arm-linux-gnueabihf-gcc v -enable-globals -prod -cflags "-static" -os linux -arch arm -o dnshammer-linux-armv7 .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install V
        if: matrix.arch != 'arm64'
        uses: vlang/setup-v@v1
        with:
          check-latest: true

      - name: Build binary
        run: ${{ matrix.build_cmd }}

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          artifacts: dnshammer-linux-${{ matrix.arch }}
          generateReleaseNotes: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

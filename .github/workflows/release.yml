name: Auto Release (All Linux Arch)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BINARY_NAME: dnshammer

jobs:
  release:
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            v_arch: amd64

          - arch: arm64
            runner: ubuntu-22.04-arm
            v_arch: arm64

          - arch: armv7
            runner: ubuntu-latest
            v_arch: arm

          - arch: 386
            runner: ubuntu-latest
            v_arch: 386

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install V
        uses: vlang/setup-v@v1
        with:
          check-latest: true

      - name: Build binary
        run: v -enable-globals -prod -os linux -arch ${{ matrix.v_arch }} -o ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }} .

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          artifacts: ${{ env.BINARY_NAME }}-linux-${{ matrix.arch }}
          generateReleaseNotes: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
